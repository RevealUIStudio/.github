name: promotion-gate
description: >
  Enforce test→main promotion: PR head must be this repo's test branch, and
  test must contain all of main (merge-commit ancestry, not squash).
  Shared across the fleet so promotion policy cannot drift (GAP-370 structural
  follow-up / fleet-redundancy Phase 5 GHA presets).

inputs:
  head_ref:
    description: PR head branch name (github.head_ref)
    required: true
  head_repo:
    description: PR head repo full name (owner/repo)
    required: true
  base_repo:
    description: Base repository full name (github.repository)
    required: true
  head_sha:
    description: PR head commit SHA to check out
    required: true
  base_ref:
    description: PR base branch name (usually main)
    required: true
    default: main

runs:
  using: composite
  steps:
    - name: Verify head branch is 'test' from the canonical repo
      shell: bash
      env:
        HEAD_REF: ${{ inputs.head_ref }}
        HEAD_REPO: ${{ inputs.head_repo }}
        BASE_REPO: ${{ inputs.base_repo }}
      run: |
        set -euo pipefail
        # A fork can name a branch 'test' and open a PR to main; head_ref alone
        # ('test') would pass, and the ancestry check below only proves the fork
        # branch contains main — not that the changes were promoted through THIS
        # repo's test branch. Require the PR to originate from this repository.
        if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "::error title=Cross-repo promotion::Promotion PRs to main must come from '$BASE_REPO' (this repo's 'test' branch), not a fork. Got head repo: '$HEAD_REPO'."
          exit 1
        fi
        if [ "$HEAD_REF" != "test" ]; then
          echo "::error title=Wrong head branch::Promotion PRs to main must come from 'test'. Got: '$HEAD_REF'."
          echo ""
          echo "Feature branches must merge to 'test' first, then 'test' promotes to 'main'."
          exit 1
        fi

    - name: Checkout PR head
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0

    - name: Verify test contains all of main
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
      run: |
        set -euo pipefail
        # checkout above runs with fetch-depth: 0, which already fetched all
        # refs (including origin/$BASE_REF) WITH credentials. Re-fetching here
        # anonymously breaks on PRIVATE repos (persist-credentials: false →
        # "could not read Username"), so only fetch when the ref is missing.
        git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1 || git fetch origin "$BASE_REF" --depth=200
        base_sha=$(git rev-parse "origin/$BASE_REF")

        if git merge-base --is-ancestor "$base_sha" HEAD; then
          echo "test contains all of $BASE_REF ✓"
          exit 0
        fi

        behind=$(git rev-list --count "HEAD..origin/$BASE_REF")
        echo "::error title=test is behind main::test is $behind commit(s) behind '$BASE_REF'. Backflow main into test using a merge commit (NOT squash):"
        echo ""
        echo "  git checkout test"
        echo "  git fetch origin"
        echo "  git merge --no-ff origin/$BASE_REF"
        echo "  git push origin test"
        echo ""
        echo "Squash-merging main into test produces the same red X — main's parentage isn't preserved."
        echo ""
        echo "Missing commits:"
        git log --oneline -20 "HEAD..origin/$BASE_REF"
        exit 1

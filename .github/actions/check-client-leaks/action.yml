name: check-client-leaks
description: >
  Run the repo's scripts/check-client-leaks.sh after checkout. Preserves the
  required check context "Client / prospect name leak scan" when used from a
  job with that name. Optional CLIENT_LEAK_PATTERNS for secret-backed pattern
  mirrors (e.g. revforge).

inputs:
  client_leak_patterns:
    description: Optional multiline pattern list (usually secrets.CLIENT_LEAK_PATTERNS)
    required: false
    default: ""
  fetch_depth:
    description: actions/checkout fetch-depth
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: ${{ inputs.fetch_depth }}
        persist-credentials: false

    - name: Run scanner
      shell: bash
      env:
        CLIENT_LEAK_PATTERNS: ${{ inputs.client_leak_patterns }}
      run: bash scripts/check-client-leaks.sh

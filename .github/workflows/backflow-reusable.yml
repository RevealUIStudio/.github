name: backflow-reusable

# Org-shared REUSABLE backflow workflow. Each repo adds a thin caller
# (.github/workflows/backflow-main-into-test.yml) that triggers on push:main and
# `uses:` this workflow with `secrets: inherit`. When main moves, this opens or
# updates a "backflow main into test" PR if test is behind main. Companion to
# promotion-gate.yml — that REJECTS stale promotions; this PROACTIVELY heals them.
#
# Auth: GitHub App installation token (actions/create-github-app-token) instead of
# GITHUB_TOKEN, because (1) the org blocks GITHUB_TOKEN from creating PRs and
# (2) App-token PRs DO trigger CI (no anti-loop guard) so the backflow PR runs the
# gate normally. Creds come from the caller's BACKFLOW_APP_ID /
# BACKFLOW_APP_PRIVATE_KEY secrets (pass `secrets: inherit`); the revfleet-backflow
# App must be installed on the caller repo with Contents + Pull requests (r/w).
#
# Hardening (audit of the 2026-05-20..05-23 PR-create failures, where gh fell back
# to the org-blocked GITHUB_TOKEN). All present-day runs are healthy; these guards
# stop known latent failure modes from biting:
#   - empty-GH_TOKEN guard: refuse to run the PR step on an empty App token instead
#     of letting gh silently fall back to the org-blocked GITHUB_TOKEN (the exact
#     historical failure — the single regression that would re-arm it).
#   - state-aware PR lookup: a CLOSED-not-merged PR on the shared backflow head no
#     longer wedges `gh pr create` (422 "a pull request already exists") — reopen it.
#   - pinned --force-with-lease + push retry: a concurrent write to the shared
#     branch fails the push (then retries) rather than being silently clobbered.
#   - fetch failures fail RED, distinguished from a genuinely-absent test branch,
#     instead of a false "no backflow needed" green no-op.
#   - `set -euo pipefail` + an `if`-guarded merge/push so `merged=true` can only be
#     emitted after a confirmed push.
#   - fail fast (no retry) on a deterministic PR-auth block; retries are reserved
#     for transient (5xx / rate-limit / network) errors.
#   - re-fetch + re-target the LATEST main before merging (exit cleanly if a
#     concurrent backflow already healed test), keeping the PR's behind-count true.
#
# Caller template:
#   on: { push: { branches: [main] } }
#   jobs:
#     backflow:
#       uses: RevealUIStudio/.github/.github/workflows/backflow-reusable.yml@main
#       secrets: inherit

on:
  workflow_call:
    # Declared so callers can scope to ONLY these two secrets
    #   secrets:
    #     BACKFLOW_APP_ID: ${{ secrets.BACKFLOW_APP_ID }}
    #     BACKFLOW_APP_PRIVATE_KEY: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}
    # instead of `secrets: inherit` (which forwards every caller secret).
    # `secrets: inherit` remains valid and continues to satisfy these.
    secrets:
      BACKFLOW_APP_ID:
        description: App ID for the revfleet-backflow GitHub App.
        required: true
      BACKFLOW_APP_PRIVATE_KEY:
        description: Private key (PEM) for the revfleet-backflow GitHub App.
        required: true

permissions:
  contents: read # all writes go through the App token, not GITHUB_TOKEN

jobs:
  backflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BACKFLOW_APP_ID }}
          private-key: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check if test needs backflow
        id: check
        run: |
          set -euo pipefail

          # Distinguish a genuinely-absent `test` branch (legitimate no-op) from a
          # transient fetch/network error (must surface RED, not a silent green
          # "no backflow needed"). `git ls-remote --exit-code` returns 2 when the
          # ref is absent and a different non-zero on real errors.
          exists=0
          git ls-remote --exit-code origin test >/dev/null 2>&1 || exists=$?
          if [ "$exists" -eq 2 ]; then
            echo "::warning::No 'test' branch on origin — skipping backflow"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$exists" -ne 0 ]; then
            echo "::error title=Backflow ls-remote failed::Could not query origin for 'test' (rc=$exists). Infra error — failing loudly instead of reporting a false 'no backflow needed'."
            exit 1
          fi

          # `test` exists, so a fetch failure here is infra, not absence — retry,
          # then fail loudly rather than swallowing it as a green no-op.
          fetched=false
          for attempt in 1 2 3; do
            if git fetch origin test 2>/dev/null; then fetched=true; break; fi
            echo "::warning::git fetch origin test failed (attempt $attempt/3); retrying..."
            sleep "$((attempt * 5))"
          done
          if [ "$fetched" != true ]; then
            echo "::error title=Backflow fetch failed::Could not fetch origin/test after 3 attempts."
            exit 1
          fi

          if git merge-base --is-ancestor origin/main origin/test; then
            echo "test already contains main — no backflow needed ✓"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            behind=$(git rev-list --count origin/test..origin/main)
            echo "test is $behind commit(s) behind main"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "behind=$behind" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Attempt backflow merge
        if: steps.check.outputs.needed == 'true'
        id: merge
        run: |
          set -euo pipefail

          # Re-fetch so we backflow the LATEST main — main may have advanced since the
          # check step, which would otherwise leave the merged PR still short of "test
          # contains ALL of main" until the next run. This shrinks that window and keeps
          # the `behind` count accurate. If a concurrent backflow already healed test,
          # exit cleanly with merged=false so the PR step is skipped.
          git fetch origin main test
          if git merge-base --is-ancestor origin/main origin/test; then
            echo "::notice::test already contains main (healed since the check step) — nothing to backflow."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          behind=$(git rev-list --count origin/test..origin/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

          git checkout -B chore/backflow-main-into-test origin/test

          # `git log -20` (not `| head -20`) avoids a SIGPIPE under `pipefail`.
          missing=$(git log -20 --oneline origin/test..origin/main)
          {
            echo "Merge main into test"
            echo ""
            echo "Auto-opened by the shared backflow-reusable workflow after main"
            echo "moved forward. Merge commit (no squash) per"
            echo "feedback_merge_main_into_test_must_use_merge_commit so main's"
            echo "parentage is preserved and the next promotion-gate check passes."
            echo ""
            echo "Missing commits backflowed:"
            echo "$missing"
          } > /tmp/merge-msg.txt

          if ! git merge --no-ff -F /tmp/merge-msg.txt origin/main; then
            echo "::error title=Backflow merge conflict::Auto-backflow hit content conflicts. Resolve manually: git checkout test && git fetch origin && git merge --no-ff origin/main && resolve && git push origin test"
            exit 1
          fi

          # Push with a pinned lease so a concurrent write to the shared backflow
          # branch fails the push (and retries) rather than being silently clobbered.
          # Re-fetch the branch each attempt to refresh the lease baseline; lease
          # against the observed remote tip, or plain-create when the branch is
          # absent. `if git push` keeps a rejected push from aborting under `set -e`,
          # so the loop can retry. `merged=true` is emitted only after a confirmed push.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin chore/backflow-main-into-test 2>/dev/null || true
            expect=$(git rev-parse --verify --quiet origin/chore/backflow-main-into-test || echo "")
            if [ -n "$expect" ]; then
              if git push origin chore/backflow-main-into-test --force-with-lease=chore/backflow-main-into-test:"$expect"; then pushed=true; break; fi
            else
              if git push origin chore/backflow-main-into-test; then pushed=true; break; fi
            fi
            echo "::warning::backflow branch push rejected (attempt $attempt/3) — refreshing lease baseline and retrying..."
            sleep "$((attempt * 5))"
          done
          if [ "$pushed" != true ]; then
            echo "::error title=Backflow push failed::Could not push chore/backflow-main-into-test after 3 attempts (lease conflict or transient error)."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Open or update backflow PR
        if: steps.check.outputs.needed == 'true' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Prefer the merge step's recomputed count (post re-fetch) so the PR title
          # is accurate even if main advanced after the check step; fall back to check.
          BEHIND: ${{ steps.merge.outputs.behind || steps.check.outputs.behind }}
          REPO: ${{ github.repository }}
        run: |
          # Refuse to proceed on an empty App token. Without this, gh silently falls
          # back to the runtime GITHUB_TOKEN, which the org blocks from creating PRs —
          # the exact 2026-05-20..05-23 failure. Failing loudly here means a future
          # edit that drops/renames the GH_TOKEN binding can't silently regress.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Backflow App token empty::GH_TOKEN (App installation token) is empty — refusing to fall back to the org-blocked GITHUB_TOKEN. Check the create-github-app-token step id and BACKFLOW_APP_ID / BACKFLOW_APP_PRIVATE_KEY."
            exit 1
          fi

          title="chore(test): backflow main into test ($BEHIND commit(s) behind)"
          {
            echo "## Summary"
            echo ""
            echo "Auto-opened by the shared backflow-reusable workflow because \`main\` moved forward and \`test\` is $BEHIND commit(s) behind."
            echo ""
            echo "## Why this exists"
            echo ""
            echo "Without backflow, the next \`test\` → \`main\` promotion fails the \`promotion-gate\` check (it requires test to contain all of main). This PR catches \`test\` up so the next promotion lands cleanly."
            echo ""
            echo "## Merge instructions"
            echo ""
            echo "**Merge as a merge commit (NOT squash) per \`feedback_merge_main_into_test_must_use_merge_commit\`:**"
            echo ""
            echo '```'
            echo "gh pr merge <PR#> --merge --delete-branch --repo $REPO"
            echo '```'
            echo ""
            echo "Squash strips \`main\`'s parentage — \`promotion-gate\` will re-flag the same condition on the next push to main, and another backflow PR will auto-open."
            echo ""
            echo "_Opened via a GitHub App token, so CI runs normally on this PR. Per \`feedback_no_auto_merge\`: manual merge only — no \`--auto\`._"
          } > /tmp/pr-body.md

          # Idempotent open-or-update, robust to a CLOSED-not-merged PR on the shared
          # backflow head (which would otherwise wedge `gh pr create` permanently with
          # a 422 "a pull request already exists"). Order: update an OPEN PR if one
          # exists (the retry case); else create; if create reports "already exists",
          # a closed PR is blocking the head — reopen + update it instead of failing.
          open_or_update_pr() {
            local existing closed
            existing=$(gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test --state open --json number --jq '.[0].number // empty') || return 1
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file /tmp/pr-body.md || return 1
              echo "Updated existing open backflow PR #$existing"
              return 0
            fi
            if gh pr create --repo "$REPO" --base test --head chore/backflow-main-into-test --title "$title" --body-file /tmp/pr-body.md 2>/tmp/pr-create.err; then
              echo "Created new backflow PR"
              return 0
            fi
            if grep -qi "already exists" /tmp/pr-create.err; then
              closed=$(gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test --state closed --json number,state --jq '[.[] | select(.state == "CLOSED")][0].number // empty') || return 1
              if [ -n "$closed" ]; then
                gh pr reopen "$closed" --repo "$REPO" || return 1
                gh pr edit "$closed" --repo "$REPO" --title "$title" --body-file /tmp/pr-body.md || return 1
                echo "Reopened + updated previously-closed backflow PR #$closed"
                return 0
              fi
            fi
            # Deterministic auth block (the historical GITHUB_TOKEN/org-toggle failure,
            # or the App losing 'Pull requests: write'). Retrying 4x just wastes ~90s
            # and buries the cause — fail fast with a pointed message.
            if grep -qi "not permitted to create or approve" /tmp/pr-create.err; then
              echo "::error title=Backflow PR auth blocked::gh was refused PR creation ('not permitted to create or approve pull requests') — the App token (GH_TOKEN) is empty/wrong or the revfleet-backflow App lacks 'Pull requests: write'. Not retrying (deterministic)."
              cat /tmp/pr-create.err >&2
              exit 1
            fi
            cat /tmp/pr-create.err >&2
            return 1
          }

          # Retry with backoff for TRANSIENT failures (5xx / rate-limit / network).
          # A persistent failure still exits non-zero so unhealed staleness stays
          # visible (red). The deterministic blockers above (empty token, closed-PR
          # wedge) are handled before/inside the function, not by burning retries.
          attempt=0
          max=4
          until open_or_update_pr; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max" ]; then
              echo "::error title=Backflow PR open failed::Could not open/update the backflow PR after $max attempts. The chore/backflow-main-into-test branch is already pushed (it carries the main→test merge), so recovery is just opening the PR manually."
              exit 1
            fi
            echo "::warning::backflow PR open attempt $attempt/$max failed; retrying in $((attempt * 15))s..."
            sleep "$((attempt * 15))"
          done
